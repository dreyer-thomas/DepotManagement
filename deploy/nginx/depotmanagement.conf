# Example Nginx server block for DepotManagement behind TLS. Copy to /etc/nginx/sites-available/
# (or /etc/nginx/conf.d/), replace depot.example.com with your host name, then: sudo nginx -t && sudo systemctl reload nginx
# Certificates: sudo certbot certonly --webroot -w /var/www/html -d depot.example.com --deploy-hook "systemctl reload nginx"
# (or `--nginx` with the certbot Nginx plugin; paths below are certbot's defaults; the hook makes
# renewals reload Nginx).
# See README.md, "Production deployment".

server {
    listen 80;
    listen [::]:80;
    server_name depot.example.com;

    # certbot's webroot challenge stays on HTTP so renewals work; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # Nginx >= 1.25.1; on older versions drop this line and write `listen 443 ssl http2;` instead.
    http2 on;
    server_name depot.example.com;

    ssl_certificate     /etc/letsencrypt/live/depot.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/depot.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Uploads (Parqet CSV, broker PDF batches, restore files) go through Next server actions, limited
    # to 60 MB in next.config.ts (serverActions.bodySizeLimit, proxyClientMaxBodySize). Keep this at
    # least as large, or Nginx rejects big uploads with 413 before they reach the app.
    client_max_body_size 64m;

    location / {
        # The app listens on 127.0.0.1 only (scripts/start.sh); PORT in the env file must match.
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # The session cookie's Secure flag depends on X-Forwarded-Proto, and the server-action origin
        # check compares the browser's Origin with X-Forwarded-Host/Host.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        # Large imports and restores can take a while.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
